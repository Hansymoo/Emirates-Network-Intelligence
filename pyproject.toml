[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emirates-network-intelligence"
version = "0.1.0"
description = "Emirates network and fleet intelligence pipeline (independent analysis, not affiliated with Emirates)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.3",
    "numpy>=2.0",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that need a running PostgreSQL (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"